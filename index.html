<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple product manager powered by the LAB 4 Store class." />
    <title>DOM Store - Lab 5</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">JavaScript Core · Week 5</p>
        <h1>DOM Store</h1>
        <p class="intro">Manage your products and see the inventory value update instantly.</p>
      </header>

      <section class="panel form-panel" aria-labelledby="form-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Inventory</p>
            <h2 id="form-title">Add a product</h2>
          </div>
        </div>

        <form id="product-form" novalidate>
          <div class="form-fields">
            <div class="field">
              <label for="product-name">Product name</label>
              <input id="product-name" name="name" type="text" autocomplete="off" aria-describedby="name-error" />
              <span class="field-error" id="name-error" aria-live="polite"></span>
            </div>
            <div class="field">
              <label for="product-price">Price</label>
              <input id="product-price" name="price" type="text" inputmode="decimal" aria-describedby="price-error" />
              <span class="field-error" id="price-error" aria-live="polite"></span>
            </div>
            <div class="field">
              <label for="product-quantity">Quantity</label>
              <input id="product-quantity" name="quantity" type="text" inputmode="numeric" aria-describedby="quantity-error" />
              <span class="field-error" id="quantity-error" aria-live="polite"></span>
            </div>
            <button class="button button-primary add-button" type="submit">Add product</button>
          </div>
        </form>
      </section>

      <section class="panel products-panel" aria-labelledby="products-title">
        <div class="section-heading products-heading">
          <div>
            <p class="eyebrow">Your stock</p>
            <h2 id="products-title">Products</h2>
          </div>
          <p class="product-count"><span id="product-count">0</span> items</p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Product</th>
                <th scope="col">Price</th>
                <th scope="col">Quantity</th>
                <th scope="col">Value</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="product-list"></tbody>
          </table>
        </div>
      </section>

      <footer class="total-bar" aria-live="polite">
        <span>Total inventory value</span>
        <strong id="live-total">$0.00</strong>
      </footer>
    </main>
  </body>
</html>
